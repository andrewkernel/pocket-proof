name: Release Pocket Proof v1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-bootstrap.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pocket-proof-release-v1
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and verify reviewed release
        shell: bash
        run: |
          set -euo pipefail
          cat .release-bundle/chunk-* | base64 --decode > "$RUNNER_TEMP/pocket-proof-release.tar.gz"
          echo "7d715e9d848af7364d9ea0926cf875791cde406adac0ee4340692186b175f8a4  $RUNNER_TEMP/pocket-proof-release.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/release"
          tar -xzf "$RUNNER_TEMP/pocket-proof-release.tar.gz" -C "$RUNNER_TEMP/release"
          git -C "$RUNNER_TEMP/release" init --quiet
          git -C "$RUNNER_TEMP/release" add -A
          test "$(git -C "$RUNNER_TEMP/release" write-tree)" = "7bfdabdf219e38099c234b04c3c60de38eaa3a68"

      - name: Replace temporary publisher with reviewed tree
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a "$RUNNER_TEMP/release/." .
          git add -A
          test "$(git write-tree)" = "7bfdabdf219e38099c234b04c3c60de38eaa3a68"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Release Pocket Proof v1.0.0"
          git push origin HEAD:main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify release
        run: |
          npm ci --ignore-scripts
          npm test
          npm run typecheck
          npm run build:pages

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
